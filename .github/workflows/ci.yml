name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates the Prisma client only — does not need a live DATABASE_URL.
      - run: pnpm exec prisma generate

      - run: pnpm exec tsc --noEmit

      - run: pnpm lint
